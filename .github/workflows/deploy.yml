name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
          mkdir -p dist/privacy dist/windows-app-privacy dist/terms dist/contact dist/download dist/blog
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/windows-app-privacy/index.html
          cp dist/index.html dist/terms/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/download/index.html
          cp dist/index.html dist/blog/index.html
          for file in src/content/blog/*.md; do
            if [ -f "$file" ]; then
              slug=$(basename "$file" .md)
              mkdir -p "dist/blog/$slug"
              cp dist/index.html "dist/blog/$slug/index.html"
            fi
          done
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
