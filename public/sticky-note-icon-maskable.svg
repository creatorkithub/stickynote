<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Dark Background Icon Base -->
  <rect width="512" height="512" rx="0" fill="#0F172A" />
  
  <!-- 3D Sticky Note Paper with Folded Corner Shadow -->
  <g filter="url(#dropShadow)" transform="rotate(-3 256 256)">
    <!-- Base Note -->
    <rect x="96" y="96" width="320" height="320" rx="16" fill="url(#yellowGrad)" />
    <!-- Header Drag Bar -->
    <rect x="96" y="96" width="320" height="48" rx="16" fill="url(#headerGrad)" />
    <!-- Pin Circle -->
    <circle cx="256" cy="120" r="12" fill="#E11D48" />
    <circle cx="254" cy="118" r="4" fill="#FFAAT1" opacity="0.6" />
    
    <!-- Text Lines -->
    <rect x="136" y="180" width="200" height="16" rx="8" fill="#713F12" opacity="0.8" />
    <rect x="136" y="216" width="240" height="14" rx="7" fill="#713F12" opacity="0.6" />
    <rect x="136" y="250" width="180" height="14" rx="7" fill="#713F12" opacity="0.6" />
    
    <!-- Checkboxes / Bullet Points -->
    <rect x="136" y="294" width="20" height="20" rx="4" fill="#CA8A04" />
    <path d="M141 304 l3 3 l7 -7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="168" y="297" width="150" height="14" rx="7" fill="#713F12" opacity="0.7" />
    
    <rect x="136" y="330" width="20" height="20" rx="4" stroke="#CA8A04" stroke-width="2" fill="none" />
    <rect x="168" y="333" width="120" height="14" rx="7" fill="#713F12" opacity="0.4" />
    
    <!-- Folded Bottom Right Corner -->
    <path d="M376 416 L416 376 L376 376 Z" fill="#CA8A04" opacity="0.5" />
  </g>
</svg>
